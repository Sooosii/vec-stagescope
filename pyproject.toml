[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-stagescope"
version = "0.1.0"
description = "Depth-matched stage-proximity diagnostic for Virtual Embryo Challenge predictions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "anndata"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
vec-stagescope = "vec_stagescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
